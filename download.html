<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダウンロード - キャラクターガイドライン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>キャラクターガイドライン</h1>
            <nav>
                <a href="index.html" class="nav-link">ガイドライン</a>
                <a href="download.html" class="nav-link active">ダウンロード</a>
            </nav>
        </header>

        <main class="download-content">
            <div class="download-section">
                <h2>キャラクターSVGデータのダウンロード</h2>
                <p class="download-description">
                    キャラクターのSVGデータをダウンロードできます。<br>
                    ダウンロード前に、必ずガイドラインを確認してください。
                </p>
                
                <div class="download-box">
                    <div class="download-placeholder">
                        <p>SVGデータプレビュー</p>
                    </div>
                    <div class="download-info">
                        <h3>キャラクターSVGデータ.zip</h3>
                        <p class="file-size">ファイルサイズ: 約2.5MB</p>
                        <p class="file-description">
                            このファイルには、キャラクターのSVGデータが含まれています。<br>
                            使用前にガイドラインを必ずご確認ください。
                        </p>
                    </div>
                </div>

                <div class="guideline-reminder">
                    <h3>ダウンロード前に確認</h3>
                    <ul>
                        <li>カラーガイドを確認しましたか？</li>
                        <li>セリフの特徴を理解しましたか？</li>
                        <li>使用場面を確認しましたか？</li>
                    </ul>
                </div>

                <div class="download-action">
                    <div class="checkbox-wrapper">
                        <label class="checkbox-label">
                            <input type="checkbox" id="guideline-checkbox">
                            <span>ガイドラインをよく読み、理解しました</span>
                        </label>
                    </div>
                    <button id="download-btn" class="download-button" disabled>ダウンロード</button>
                </div>
            </div>
        </main>
    </div>

    <script src="download.js"></script>
</body>
</html>
